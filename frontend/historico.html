<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico - Analisador Espectral de Áudio</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>Analisador Espectral de Áudio</h1>
    <nav>
      <a href="index.html">Nova análise</a>
      <a href="historico.html" class="ativo">Histórico</a>
    </nav>
  </header>

  <main>
    <div id="mensagem" class="mensagem" hidden></div>

    <!-- INT03 - Tela de histórico (RF007, RF008) -->
    <section class="cartao">
      <h2>Histórico de análises</h2>

      <p id="vazio" hidden>
        Ainda não há análises salvas.
        <a href="index.html">Fazer a primeira análise</a>.
      </p>

      <table id="tabela" hidden>
        <thead>
          <tr>
            <th>Data e hora</th>
            <th>Arquivo</th>
            <th>Bloco</th>
            <th>Janela</th>
            <th>Frequência de pico</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
